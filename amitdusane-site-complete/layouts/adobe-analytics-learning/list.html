{{ define "main" }}
<div class="welcome">
  <span class="welcome-icon" aria-hidden="true">
    {{ partial "logo.html" (dict "size" 58 "hidden" true) }}
  </span>
  <div class="welcome-text">
    <h1 class="welcome-title">{{ .Title }}</h1>
    <div class="hm-tagline"><span class="tl-a">Stop operating Adobe Analytics.</span> <span class="tl-b">Start architecting it.</span></div>
  </div>
</div>

<div class="hm-panel">
  <div class="hm-cue">Pick a category to explore the curriculum</div>
  {{ partial "homemap.html" . }}
</div>

<div class="lhome-foot">
  <a class="lglossary-link" href="{{ "/adobe-analytics-learning/glossary/" | relURL }}">Glossary &rarr;</a>
</div>
{{ end }}
