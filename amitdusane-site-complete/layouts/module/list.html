{{ define "main" }}
<div class="lmod-mark" aria-hidden="true">{{ partial "logo.html" (dict "size" 58 "hidden" true) }}</div>
<p class="lcrumb"><a href="{{ "/adobe-analytics-learning/" | relURL }}">Adobe Analytics Learning</a> &rsaquo; <a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a> &rsaquo; {{ .Title }}</p>
<h1 class="lmod-title">{{ .Title }}</h1>
<p>{{ .Description }}</p>
<ol class="lsec-list">
  {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}"><span class="lsn">{{ .Params.sectionnum }}</span><span>{{ .Title }}</span></a></li>
  {{ end }}
</ol>
{{ end }}
