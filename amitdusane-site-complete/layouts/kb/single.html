{{ define "main" }}
<section class="view active">
  {{ $w := index .Site.Params.worlds .Section }}
  <p class="crumb"><a href="{{ (printf "%s/" $w.root) | relURL }}">{{ $w.name }}</a> &rsaquo; <a href="{{ (printf "%s/kb/" $w.root) | relURL }}">Knowledge Base</a> &rsaquo; {{ .Title }}</p>
  <div class="eyebrow">{{ .Params.grouplabel }}</div>
  <h1>{{ .Title }}</h1>
  {{ partial "byline.html" (dict "page" . "full" true) }}
  {{ .Content }}
</section>
{{ end }}
