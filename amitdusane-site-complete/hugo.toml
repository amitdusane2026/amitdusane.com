# ---------------------------------------------------------------------------
# WORLD REGISTRY (INF-05, INF-06)
#
# A "world" is a self-contained sub-site: its own stylesheet, script, shell and
# print document. It used to be identified by an if/else chain on the URL
# prefix in two templates, and its phases lived in a single global
# [params.phases] that any world using the shared partials would inherit.
# Both would have broken on the third world -- CJA -- and the fix is far
# cheaper before that exists than after.
#
# The key is the page's top-level .Section, so adding a world is a block here
# rather than another branch in a template.
#   css   stylesheet in static/, loaded only on that world
#   js    script in static/, loaded only on that world
#   root  the world's home page, for partials that need to link back to it
#   phases  editorial grouping of modules. Hugo knows a module exists; it does
#           not know which phase it belongs to. That judgment lives here. To
#           add a module, add its modulenum to the right phase. Order here is
#           the order shown.
# ---------------------------------------------------------------------------
# THE REGISTRY GREW FOUR KEYS ON 6 SEPTEMBER 2026, when a second procedure
# world arrived and proved that "a new world is a config block" was not yet
# true. Four templates queried `Type "step"` globally, so two procedure worlds
# would have mixed their steps in the rail, the step nav, the navigator and the
# schema; and four breadcrumbs said "Migration" in hardcoded text. Both are now
# read from here.
#
#   shape      procedure | curriculum. Drives which shell baseof.html renders,
#              so a third procedure world needs no new branch.
#   bodyclass  the world's own body class. NOT derived from the section name,
#              because world-migration carries this guide's blue accent through
#              twenty rules in chrome.css; a second procedure world shares the
#              stylesheet and needs its own accent, not this one's.
#   name       the breadcrumb label. Short, it sits before every page title.
#   railtitle  the heading over the step list in the left rail.
[params.worlds]
  [params.worlds.web-sdk-migration]
    css       = "world-shell.css"
    js        = "world-migration.js"
    root      = "/web-sdk-migration"
    shape     = "procedure"
    order     = 2
    bodyclass = "world-migration"
    name      = "Migration"
    fullname  = "Web SDK Migration"
    seriesname = "AppMeasurement to Adobe Web SDK Migration Guide"
    howto      = "Migrate from AppMeasurement to the Adobe Web SDK"
    railtitle = "The Migration"
    punch_a   = "Stop sending beacons."
    punch_b   = "Start sending events."
    cue       = "in the order the work happens"
    # The social card for every page in this world. One image per world rather
    # than one for the site: og-default.jpg was the Web SDK card, and it was
    # being served on all 144 learning pages too.
    og        = "og-web-sdk-migration.jpg"

  [params.worlds.adobe-analytics-learning]
    css       = "world-learning.css"
    js        = "world-learning.js"
    root      = "/adobe-analytics-learning"
    shape     = "curriculum"
    order     = 1
    bodyclass = "world-learning"
    name      = "Adobe Analytics"
    fullname  = "Adobe Analytics Learning"
    og        = "og-adobe-analytics-learning.jpg"

  # Section 3, started 6 September 2026. Procedure shape, so it shares
  # world-shell.css and the migration shell rather than forking either.
  [params.worlds.aep-mobile-sdk]
    css       = "world-shell.css"
    js        = "world-migration.js"
    root      = "/aep-mobile-sdk"
    shape     = "procedure"
    order     = 3
    bodyclass = "world-mobile"
    name      = "Mobile SDK Implementation"
    fullname  = "Adobe Experience Platform Mobile SDK"
    seriesname = "Adobe Experience Platform Mobile SDK Implementation Guide"
    howto      = "Implement the Adobe Experience Platform Mobile SDK"
    railtitle = "The Implementation"
    punch_a   = "You will not write the app."
    punch_b   = "You will still have to debug it."
    cue       = "in the order the work happens"
    og        = "og-aep-mobile-sdk.jpg"
    # No `railgroups` and no `basicsworld` since 11 September 2026. The rail is
    # flat, every step and sub-step visible, and it no longer links to Mobile
    # App Basics: the steps do that themselves, in the prose and in Why? rows
    # pointing at the exact topic. Amit's call, the same day both were built.

# ---------------------------------------------------------------------------
# THE FIRST BASICS SECTION, 11 September 2026.
#
# Basics is a section type of its own, decided by Amit the same day, alongside
# learning, step-by-step, certification and documentation. A Basics section
# teaches the vocabulary of a whole field to somebody new to it: enough to
# follow a developer, answer in a meeting, and ask for the right thing. It is
# not a course in the field.
#
# Mobile App Basics is the first instance and Website Basics will be the
# second. Both use world-basics.css and world-basics.js; each declares only its
# own name, accent (by bodyclass), premise and groups here.
#
# It sits on the home page in its own "Start here" row, above the guides,
# because it is where a newcomer begins rather than a guide chosen between.
# ---------------------------------------------------------------------------
[params.worlds.mobile-app-basics]
  css       = "world-basics.css"
  js        = "world-basics.js"
  root      = "/mobile-app-basics"
  shape     = "basics"
  order     = 10
  bodyclass = "world-mab"
  name      = "Mobile App Basics"
  fullname  = "Mobile App Basics"
  tilesub   = "The words a mobile developer uses, explained plainly"
  # Reuses the Mobile SDK card until one is made for this section.
  og        = "og-aep-mobile-sdk.jpg"
  premise   = "This section will not teach you to build mobile apps. It teaches you enough of the mobile world to understand what a developer is saying, to answer questions in a meeting when no developer is there, and to tell a developer exactly what you need and where it has to change. Words like Xcode, Gradle, native, Flutter and WebView are used here on purpose, because you will hear them in every meeting."
  # The line under every topic headline. Per instance since Website Basics,
  # because the topic template used to say "apps" for every Basics section.
  remind    = "Not a course in building apps. Just enough to follow the conversation."

[params.worlds.mobile-app-basics.groups]
  [params.worlds.mobile-app-basics.groups.kind]
    order = 1
    label = "App types"
  [params.worlds.mobile-app-basics.groups.world]
