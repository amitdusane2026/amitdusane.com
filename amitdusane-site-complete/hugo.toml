    weight = 3

# ---------------------------------------------------------------------------
# Learning Hub phases. Editorial grouping for the "See where this fits" map
# and the home page. Hugo knows a module exists; it does not know which phase
# it belongs to. That judgment lives here. To add a module later, add its
# modulenum to the right phase. Order of phases here is the order shown.
# ---------------------------------------------------------------------------
[params.phases]
  [params.phases.foundations]
    order = 1
    name = "Start with the foundations"
    blurb = "What the tool is, and what everything rests on."
    modules = [1, 2, 3]
  [params.phases.collect]
    order = 2
    name = "Collect the data"
    blurb = "How data gets from a page or an app into Adobe."
    modules = [4, 5, 6, 7]
  [params.phases.shape]
    order = 3
    name = "Shape the data"
    blurb = "Make the raw data mean something before anyone reads it."
    modules = [8, 9, 10, 11]
  [params.phases.analyze]
    order = 4
    name = "Analyze the data"
    blurb = "Ask questions of the data and find the answers."
    modules = [12, 13, 14, 15, 16, 17, 18]
  [params.phases.deliver]
    order = 5
    name = "Deliver and maintain"
    blurb = "Design it before it is built, prove it works, and know where it goes next."
    modules = [19, 20, 21]
