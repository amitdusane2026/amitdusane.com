# ---------------------------------------------------------------------------
# THE MIGRATION GUIDE'S FOUR STAGES, added 2 Sep 2026 when its front page was
# rebuilt around a navigator.
#
# Thirteen numbered steps in one flat list is a wall, and it tells a visitor
# nothing about the shape of the work. These four groups are how the migration
# actually runs, and the boundaries are real rather than cosmetic: nothing is
# built in stage one, stage two is entirely Adobe-side plumbing that never
# touches your data, stage three is where your own implementation starts
# flowing, and stage four is the only part that can break production.
#
# KEYED ON STEP NUMBER, mirroring [params.worlds.adobe-analytics-learning.phases]
# exactly, which is keyed on module number. That is deliberate: the grouping
# lives in config for both worlds, so neither one needs a field added to every
# content file, and a step can move between stages without editing its page.
# ---------------------------------------------------------------------------
[params.worlds.web-sdk-migration.phases]
  [params.worlds.web-sdk-migration.phases.understand]
    order = 1
    name = "Understand the change"
    blurb = "What actually moves, and what you already have."
    steps = [1, 2]
  [params.worlds.web-sdk-migration.phases.build]
    order = 2
    name = "Build the pipeline"
    blurb = "The Adobe-side plumbing, before any of your data touches it."
    steps = [3, 4, 5, 6]
  [params.worlds.web-sdk-migration.phases.move]
    order = 3
    name = "Move the data"
    blurb = "Your variables, your identity and your consent, flowing through it."
    steps = [7, 8, 9, 10]
  [params.worlds.web-sdk-migration.phases.prove]
    order = 4
    name = "Prove it and cut over"
    blurb = "Confirm it matches the old beacon, then retire the old beacon."
    steps = [11, 12, 13]
