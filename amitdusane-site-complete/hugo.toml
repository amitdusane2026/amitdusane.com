baseURL = "https://amitdusane.com/"
languageCode = "en-us"
title = "Amit G Dusane"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# ---------------------------------------------------------------------------
# CRITICAL. Do not remove.
# By default Hugo derives `date` from `lastmod`, then derives `publishDate`
# from `date`. A `lastmod` that is even one day ahead of the BUILD SERVER's
# clock therefore gives the page a future publishDate, and Hugo SILENTLY
# DROPS it from the build. No error. No warning. The page simply 404s.
#
# This bites hard here: GitHub Actions builds in UTC, the author writes dates
# in IST (UTC+5:30). Any page dated "today" in IST is "tomorrow" in UTC for
# five and a half hours of every day.
#
# The lines below decouple lastmod from the date cascade entirely. lastmod
# now means only "when was this content last revised", which is all it should
# ever have meant.
# ---------------------------------------------------------------------------
[frontmatter]
  date = ["date", "publishDate"]
  lastmod = ["lastmod"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]

[outputs]
  home = ["HTML", "JSON"]

[params]
  author = "Amit G Dusane"
  jobTitle = "Adobe Experience Platform Architect"
  linkedin = "https://www.linkedin.com/in/amitdusane/"

[services]
  [services.googleAnalytics]
    ID = "G-9817PZWN9H"
  # crimson brand + blue functional accent carried from the app (full look/feel = Phase 2)
  brandColor = "#e11d48"
  accentColor = "#1f5fae"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Web SDK Migration"
    url = "/web-sdk-migration/"
    weight = 2
  [[menu.main]]
