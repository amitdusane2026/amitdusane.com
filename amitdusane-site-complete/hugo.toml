# ---------------------------------------------------------------------------
# WORLD REGISTRY (INF-05, INF-06)
#
# A "world" is a self-contained sub-site: its own stylesheet, script, shell and
# print document. It used to be identified by an if/else chain on the URL
# prefix in two templates, and its phases lived in a single global
# [params.phases] that any world using the shared partials would inherit.
# Both would have broken on the third world -- CJA -- and the fix is far
# cheaper before that exists than after.
#
# The key is the page's top-level .Section, so adding a world is a block here
# rather than another branch in a template.
#   css   stylesheet in static/, loaded only on that world
#   js    script in static/, loaded only on that world
#   root  the world's home page, for partials that need to link back to it
#   phases  editorial grouping of modules. Hugo knows a module exists; it does
#           not know which phase it belongs to. That judgment lives here. To
#           add a module, add its modulenum to the right phase. Order here is
#           the order shown.
# ---------------------------------------------------------------------------
[params.worlds]
  [params.worlds.web-sdk-migration]
    css  = "world-shell.css"
    js   = "world-migration.js"
    root = "/web-sdk-migration"

  [params.worlds.adobe-analytics-learning]
    css  = "world-learning.css"
    js   = "world-learning.js"
    root = "/adobe-analytics-learning"

# ---------------------------------------------------------------------------
# Module downloads, added 30 August 2026 for M19.
#
# Most modules teach a topic and the prose is the whole deliverable. A few
# hand the reader a set of files, and for those the files are the payload
# rather than an extra. Those modules declare their files here, keyed "m" plus
# the module number, and every section of that module then carries them in two
# places automatically: a strip below the byline, and a card pinned to the top
# of the in-page spine, which is the one piece of furniture on a section page
# reachable from any scroll position without scrolling first.
#
# It sits INSIDE the world, not at params level, for the same reason phases do.
# Module numbers repeat across worlds, so a global table would hand CJA's
# module 19 the learning world's workbooks with no error anywhere.
# ---------------------------------------------------------------------------
[params.worlds.adobe-analytics-learning.moduledocs]
  [params.worlds.adobe-analytics-learning.moduledocs.m19]
    label = "Analytics project delivery documents"
    strip = "The five delivery documents this module is built on"
    blurb = "A complete set for a fictional online homeware retailer, used as the example throughout this module. They are filled in rather than blank, because an empty grid teaches nothing and a filled one can be emptied in a minute. Delete the rows, keep the shape."
    [[params.worlds.adobe-analytics-learning.moduledocs.m19.files]]
      name = "Business Requirements Document"
      href = "/templates/adobe-analytics-business-requirements-document-template.xlsx"
      meta = "XLSX &middot; 4 sheets &middot; 36 requirements"
    [[params.worlds.adobe-analytics-learning.moduledocs.m19.files]]
      name = "Solution Design Reference"
      href = "/templates/adobe-analytics-solution-design-reference-template.xlsx"
      meta = "XLSX &middot; 8 sheets &middot; 35 solutions"
    [[params.worlds.adobe-analytics-learning.moduledocs.m19.files]]
      name = "Technical Specification Document"
      href = "/templates/adobe-analytics-technical-specification-document-template.xlsx"
      meta = "XLSX &middot; 9 sheets &middot; the SDR plus 8 columns"
    [[params.worlds.adobe-analytics-learning.moduledocs.m19.files]]
      name = "Validation Report"
      href = "/templates/adobe-analytics-validation-report-template.xlsx"
      meta = "XLSX &middot; 2 sheets &middot; 3 test cycles"
    [[params.worlds.adobe-analytics-learning.moduledocs.m19.files]]
      name = "Implementation Project Plan"
      href = "/templates/adobe-analytics-implementation-project-plan-template.xlsx"
      meta = "XLSX &middot; 2 sheets &middot; 21 activities"

