# ---------------------------------------------------------------------------
# CRITICAL. Do not remove.
# By default Hugo derives `date` from `lastmod`, then derives `publishDate`
# from `date`. A `lastmod` that is even one day ahead of the BUILD SERVER's
# clock therefore gives the page a future publishDate, and Hugo SILENTLY
# DROPS it from the build. No error. No warning. The page simply 404s.
#
# This bites hard here: GitHub Actions builds in UTC, the author writes dates
# in IST (UTC+5:30). Any page dated "today" in IST is "tomorrow" in UTC for
# five and a half hours of every day.
#
# The lines below decouple lastmod from the date cascade entirely. lastmod
# now means only "when was this content last revised", which is all it should
# ever have meant.
# ---------------------------------------------------------------------------
[frontmatter]
  date = ["date", "publishDate"]
  lastmod = ["lastmod"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]

# ---------------------------------------------------------------------------
# THE STAGING GUARD, added 2 Sep 2026.
#
# A second copy of this site is built from `develop` for a small group of
# testers. It must never be indexed by Google: the learning section is
# unpublished on the live site, and a crawlable staging copy would put all 144
# pages in the index before launch, as duplicate content against a domain that
# does not serve them yet.
#
# The protection is a `_headers` file carrying X-Robots-Tag, which is the
# strongest available and, unlike robots.txt, stops indexing even when someone
# links to the page from elsewhere. Cloudflare Pages and Netlify both read it;
# GitHub Pages ignores it, so it is harmless on production.
#
# IT IS GENERATED, NOT WRITTEN BY HAND, and that is the whole point. A static
# _headers file would be copied to every build including production, so the day
# the live site moved to Cloudflare it would silently noindex amitdusane.com.
# The template checks the baseURL instead: production emits an empty file,
# anything else emits the block. Nobody has to remember.
# ---------------------------------------------------------------------------
[mediaTypes."text/nohost"]
  suffixes = [""]
  delimiter = ""

[outputFormats.HEADERS]
  mediaType = "text/nohost"
  baseName = "_headers"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "JSON", "HEADERS"]
  # NO FEED PER SECTION. Hugo's default emits RSS for every section, which here
  # meant 27 feeds -- one for each module and phase -- that nothing linked to and
  # nobody could have wanted. The three feeds that matter are declared in the
  # front matter of the home page and the two world roots, because an explicit
  # `outputs` list there replaces the default rather than extending it.
  section = ["HTML"]

